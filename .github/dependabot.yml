version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/chromedp/*"
    ignore:
      - dependency-name: "github.com/chromedp/chromedp"
        versions: [">= 0.17.0"]
      - dependency-name: "github.com/chromedp/cdproto"
        versions: [">= 0.157.0"]
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
