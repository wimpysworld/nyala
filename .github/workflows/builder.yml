name: Builder 👷

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 0" # Weekly
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: v1.7.12
  GOLANGCI_LINT_VERSION: v2.13.1
  GORELEASER_VERSION: v2.17.1
  GOVULNCHECK_VERSION: v1.7.0
  GOCYCLO_VERSION: v0.6.0

jobs:
  changes:
    name: Changes 🔍
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect code changes
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'
      - name: Decide whether to run code jobs
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
        run: |
          if [ "${EVENT}" = "pull_request" ] || [ "${EVENT}" = "push" ]; then
            echo "code=${FILTER_CODE}" >> "${GITHUB_OUTPUT}"
          else
            echo "code=true" >> "${GITHUB_OUTPUT}"
          fi

  tidy:
    name: Tidy 🧹
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check module files
        run: go mod tidy -diff

  format:
    name: Format 🎨
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - name: Check Go formatting
        run: golangci-lint fmt --config .golangci.yml --diff

  lint-code:
    name: Lint Code 🧽
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run go vet
        run: go vet ./...
      - name: Install golangci-lint
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - name: Run golangci-lint
        run: golangci-lint run --config .golangci.yml
      - name: Report cyclomatic complexity (diagnostic only)
        continue-on-error: true
        run: |
          go install "github.com/fzipp/gocyclo/cmd/gocyclo@${GOCYCLO_VERSION}"
          gocyclo -top 20 -ignore '_test\.go$' -avg .

  lint-actions:
    name: Lint Actions ⚙️
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install actionlint
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - name: Run actionlint
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          actionlint -color

  nix:
    name: Nix ❄️
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Enable FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.24.1
        continue-on-error: true
      - name: Check flake
        run: nix flake check

  test:
    name: Test 🧪 (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: arm64
            runner: macos-15
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run tests
        if: matrix.goos != 'linux' || matrix.goarch != 'amd64'
        run: go test ./...
      # Coverage runs only on the linux/amd64 leg, so the suite is not run
      # twice. This replaces the former standalone coverage job.
      - name: Run tests with coverage
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: robherley/go-test-action@v1
        with:
          testArguments: -coverprofile=coverage.out -covermode=atomic ./...
          omit: untested
      - name: Build Nyala
        run: go build -o "${RUNNER_TEMP}/nyala" ./cmd/nyala

  gates:
    name: Gates 🚦
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The build-tagged correctness suites the untagged `go test ./...` leg
      # never compiles. Only the Chromium-free ones run here: cdpinterop and
      # live need a browser, and sixelinterop needs the sixel2png binary, which
      # `nix flake check` already covers. Those three stay local, behind
      # `just diagnostics` and `just live`.
      #
      # linux/amd64 only, deliberately: the diagnostics harness compares the
      # committed golden archives byte for byte and skips that comparison on
      # every other architecture, and this job treats a skip as a failure.
      - name: Run the tagged gates
        run: |
          set -uo pipefail
          fail=0
          # -v is what makes a skip visible at all: go test prints nothing for a
          # skipped test without it. A leg fails when go test fails, when any
          # test skipped, or when no test ran, so a wrong build tag, an empty
          # selector or a Chromium-style self-skip cannot read as coverage.
          run_leg() {
            name="$1"
            shift
            printf '\n== %s ==\n' "${name}"
            log="$(mktemp)"
            "$@" -v 2>&1 | tee "${log}" | grep -Ev '^=== (RUN|PAUSE|CONT)'
            rc=${PIPESTATUS[0]}
            skipped="$(grep -E '^[[:space:]]*--- SKIP: ' "${log}" | sed -E 's/^[[:space:]]*--- SKIP: ([^ ]+).*/\1/' || true)"
            passed="$(grep -cE '^[[:space:]]*--- PASS: ' "${log}" || true)"
            if [ -n "${skipped}" ]; then
              printf '%s: these tests skipped, which is not a pass:\n%s\n' "${name}" "${skipped}"
              rc=1
            fi
            if [ "${passed}" -eq 0 ]; then
              printf '%s: no test passed; the build tag or the test selector is wrong.\n' "${name}"
              rc=1
            fi
            printf '%s: %s passed, %s skipped, exit %s\n' \
              "${name}" "${passed}" "$(printf '%s' "${skipped}" | grep -c . || true)" "${rc}"
            rm -f "${log}"
            [ "${rc}" -eq 0 ] || fail=1
          }
          run_leg 'browser-free quality' \
            go test -count=1 -tags diagnostics ./internal/harness/
          run_leg 'Block protocol interop' \
            go test -count=1 -tags blockinterop ./internal/viewer/ -run '^TestBlockTerminalRoundTrip$'
          run_leg 'Kitty protocol interop' \
            go test -count=1 -tags kittyinterop ./internal/viewer/ -run '^TestKittyTerminalRoundTrip$'
          exit "${fail}"

  build:
    name: Build 🏗️ (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CGO_ENABLED: "0"
      GOARCH: ${{ matrix.goarch }}
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet Darwin packages
        if: matrix.goos == 'darwin'
        run: go vet ./...
      - name: Build Nyala
        run: go build -o "${RUNNER_TEMP}/nyala-${GOOS}-${GOARCH}" ./cmd/nyala

  security:
    name: Security 🔒
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # Dependency review needs the Dependency Graph plus GitHub Advanced
      # Security, which a private repo lacks. Skip while private; it switches
      # on when the repository becomes public.
      - uses: actions/dependency-review-action@v5
        if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
        with:
          fail-on-severity: moderate
          license-check: false
          fail-on-scopes: runtime
          comment-summary-in-pr: on-failure
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - name: Run govulncheck
        run: govulncheck -format sarif -scan symbol ./... > govulncheck.sarif
      # Uploading to code scanning needs GitHub Advanced Security, which a
      # private repo lacks. Skip while private; re-enables when public.
      - name: Upload SARIF
        if: ${{ always() && github.event.repository.visibility == 'public' }}
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  sentinel:
    name: Sentinel 👁️
    needs: [changes, tidy, format, lint-code, lint-actions, nix, test, gates, build, security]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      RESULTS: ${{ toJSON(needs.*.result) }}
    steps:
      - name: Check results
        run: |
          echo "Job results: ${RESULTS}"
          if echo "${RESULTS}" | jq -e 'any(. == "failure" or . == "cancelled")' > /dev/null 2>&1; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "All jobs passed"

  release-snapshot:
    name: Release Snapshot 📦
    needs: [changes, sentinel]
    if: >-
      always()
      && needs.sentinel.result == 'success'
      && needs.changes.outputs.code == 'true'
      && github.repository_owner == 'wimpysworld'
      && github.event_name != 'schedule'
      && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: nick-fields/retry@v4
        with:
          timeout_seconds: 30
          max_attempts: 3
          retry_wait_seconds: 10
          retry_on: error
          command: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Enable FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.24.1
        continue-on-error: true
      - name: Install GoReleaser
        run: go install "github.com/goreleaser/goreleaser/v2@${GORELEASER_VERSION}"
      - name: Run GoReleaser snapshot
        run: goreleaser release --snapshot --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release 📦
    needs: [sentinel]
    if: >-
      always()
      && needs.sentinel.result == 'success'
      && github.repository_owner == 'wimpysworld'
      && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: nick-fields/retry@v4
        with:
          timeout_seconds: 30
          max_attempts: 3
          retry_wait_seconds: 10
          retry_on: error
          command: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Enable FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.24.1
        continue-on-error: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Install GoReleaser
        run: go install "github.com/goreleaser/goreleaser/v2@${GORELEASER_VERSION}"
      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
      - name: Update floating major version tag
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}"
            exit 1
          fi
          major="${RELEASE_TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "${major}" -m "Update ${major} tag to ${RELEASE_TAG}"
          git push origin "${major}" --force
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Move latest tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Nix cannot see the tag, so record the version in a commit on top of it.
          git checkout --detach "${RELEASE_TAG}^{commit}"
          if [[ -f nix/package.nix ]]; then
            printf '%s\n' "${RELEASE_TAG#v}" > nix/version
            git add nix/version
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --message "chore(nix): set the package version to ${RELEASE_TAG#v}"
          fi
          git tag --force latest HEAD
          git push --force origin refs/tags/latest
      - name: Update Go Report Card
        if: ${{ !contains(github.ref_name, '-') }}
        run: curl -X POST -F "repo=github.com/$GITHUB_REPOSITORY" https://goreportcard.com/checks || true
