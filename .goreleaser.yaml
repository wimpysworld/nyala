---
version: 2

project_name: nyala

builds:
  - main: ./cmd/nyala
    binary: nyala
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"

archives:
  - id: bare
    formats:
      - binary
    name_template: "nyala-{{ .Os }}-{{ .Arch }}"

  - id: compressed
    formats:
      - tar.gz
    name_template: "nyala_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  algorithm: sha256
  name_template: "nyala_{{ .Version }}_checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    **bin** (any platform):
    ```shell
    bin install github.com/wimpysworld/nyala
    ```
    Requires [`bin`](https://github.com/marcosnils/bin).

    **Homebrew** (macOS):
    ```shell
    brew tap wimpysworld/haberdasher https://brew.wimpys.world/tap.git
    brew install --cask wimpysworld/haberdasher/nyala
    ```

    **Nix**: `nix run github:wimpysworld/nyala`

    **Docker**: `docker run --rm ghcr.io/wimpysworld/nyala`

    **Native packages**: download `.deb`, `.rpm`, `.apk`, or Arch Linux packages from the assets above. AUR: [`nyala-bin`](https://aur.archlinux.org/packages/nyala-bin).

    **GitHub Actions**:
    ```yaml
    - uses: wimpysworld/nyala@v0
    ```

nfpms:
  - id: packages
    package_name: nyala
    vendor: Martin Wimpress
    maintainer: "Martin Wimpress <code@wimpress.io>"
    description: "A browser for the terminal."
    homepage: https://github.com/wimpysworld/nyala
    license: BlueOak-1.0.0
    formats:
      - deb
      - rpm
      - apk
      - archlinux


aurs:
  - name: nyala-bin
    description: "A browser for the terminal."
    homepage: https://github.com/wimpysworld/nyala
    maintainers:
      - "Martin Wimpress <code@wimpress.io>"
    license: BlueOak-1.0.0
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/nyala-bin.git"
    package: |
      install -Dm755 nyala "${pkgdir}/usr/bin/nyala"


dockers_v2:
  - id: ghcr
    dockerfile: Dockerfile
    images:
      - "ghcr.io/wimpysworld/nyala"
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "A browser for the terminal."
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.licenses": "BlueOak-1.0.0"

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

docker_signs:
  - cmd: cosign
    artifacts: all
    args:
      - "sign"
      - "--yes"
      - "${artifact}@${digest}"
