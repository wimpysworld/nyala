---
version: 2

project_name: nyala

git:
  ignore_tags:
    - latest

before:
  hooks:
    - >-
      sh -c 'case "$GITHUB_REPOSITORY" in
      ""|/*|*/|*/*/*|*[[:space:][:cntrl:]]*) ;;
      */*) test -n "$GITHUB_REPOSITORY_OWNER" &&
      test "$GITHUB_REPOSITORY_OWNER" = "${GITHUB_REPOSITORY%%/*}" && exit 0 ;;
      esac;
      echo "set GITHUB_REPOSITORY=owner/repository and GITHUB_REPOSITORY_OWNER=owner before running GoReleaser" >&2; exit 1'

builds:
  - main: ./cmd/nyala
    binary: nyala
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"

archives:
  - id: bare
    formats:
      - binary
    name_template: "nyala-{{ .Os }}-{{ .Arch }}"

  # Linux-only tarballs for the AUR, with no OS word, so that bin picks the bare binary.
  - id: compressed
    formats:
      - tar.gz
    format_overrides:
      - goos: darwin
        formats:
          - none
      - goos: windows
        formats:
          - none
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  algorithm: sha256
  name_template: "nyala_{{ .Version }}_checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    - Debian and Ubuntu: [apt.wimpys.world](https://apt.wimpys.world/#nyala)
    - Fedora and openSUSE: [rpm.wimpys.world](https://rpm.wimpys.world/#nyala)
    - Arch Linux: [pkg.wimpys.world](https://pkg.wimpys.world/#nyala)
    - Alpine Linux: [apk.wimpys.world](https://apk.wimpys.world/#nyala)
    - macOS (Homebrew): [brew.wimpys.world](https://brew.wimpys.world/#nyala)
    - Windows (Scoop): [scoop.wimpys.world](https://scoop.wimpys.world/#nyala)
    - Nix and NixOS: [nix.wimpys.world](https://nix.wimpys.world/#nyala)
    - Any platform, with [bin](https://github.com/marcosnils/bin): `bin install github.com/wimpysworld/nyala`
    - Container: `docker run --rm ghcr.io/wimpysworld/nyala --version`
    - GitHub Actions: `uses: wimpysworld/nyala@v0`

    Nyala needs Chrome or Chromium at runtime.

nfpms:
  - id: packages
    package_name: nyala
    vendor: Martin Wimpress
    maintainer: "Martin Wimpress <code@wimpress.io>"
    description: "A browser for the terminal."
    homepage: https://nyala.wimpys.world/
    license: BlueOak-1.0.0
    file_name_template: "{{ .ConventionalFileName }}"
    bindir: /usr/bin
    formats:
      - deb
      - rpm
      - apk
      - archlinux

aurs:
  - ids:
      - compressed
    name: nyala-bin
    provides:
      - nyala
    conflicts:
      - nyala
    description: "A browser for the terminal."
    homepage: https://nyala.wimpys.world/
    maintainers:
      - "Martin Wimpress <code@wimpress.io>"
    license: BlueOak-1.0.0
    optdepends:
      - "chromium: local headless browser rendering"
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/nyala-bin.git"
    package: |
      install -Dm755 nyala "${pkgdir}/usr/bin/nyala"
      install -Dm644 LICENSE "${pkgdir}/usr/share/licenses/nyala-bin/LICENSE"

retry:
  attempts: 5
  delay: 10s
  max_delay: 2m

dockers_v2:
  - id: ghcr
    dockerfile: Dockerfile
    images:
      - "ghcr.io/wimpysworld/nyala"
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "A browser for the terminal."
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.licenses": "BlueOak-1.0.0"

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

docker_signs:
  - cmd: cosign
    artifacts: all
    args:
      - "sign"
      - "--yes"
      - "${artifact}@${digest}"
